<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit portfolio</title>
<style>body{margin:0;background:#111;color:#eee;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.top a{color:#f0c83f}.grid{display:grid;grid-template-columns:1fr 360px;gap:25px;margin-top:28px}.panel{background:#191919;border:1px solid #292929;border-radius:18px;padding:18px}.card{background:#141414;border:1px solid #303030;border-radius:14px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:11px;color:#999;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.08em}input,textarea{width:100%;background:#0b0b0b;border:1px solid #333;color:white;border-radius:9px;padding:10px}textarea{min-height:80px;resize:vertical}button,.btn{border:0;border-radius:9px;padding:10px 12px;background:#f0c83f;color:#16120a;font-weight:700;cursor:pointer}.secondary{background:#292929;color:#ddd}.danger{background:#3a1717;color:#ffbcbc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:7px;border:1px solid #444}.note{font-size:13px;line-height:1.5;color:#aaa}.sticky{position:sticky;top:20px;height:max-content}.file{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.sticky{position:static}}</style></head><body><div class="wrap"><div class="top"><div><h1>Portfolio editor</h1><p class="note">Add projects and upload creative images. Changes preview immediately in this browser.</p></div><a href="index.html">View portfolio →</a></div><div class="grid"><main id="list"></main><aside class="panel sticky"><h3>Publishing</h3><p class="note">GitHub Pages cannot directly save browser uploads into your repo. Use this editor to curate and preview. Export JSON for backup or to commit later.</p><div class="actions"><button onclick="addProject()">+ Add project</button><button class="secondary" onclick="exportJSON()">Export JSON</button><label class="btn secondary" for="importFile">Import JSON</label><input class="file" id="importFile" type="file" accept="application/json"></div><hr style="border-color:#2b2b2b;margin:20px 0"><button class="danger" onclick="resetAll()">Reset demo</button></aside></div></div>
<script>
const defaults=[{type:'intro',eyebrow:'Written by',title:'Your Name',desc:'Ideas, films, campaigns and strange little things worth making.',meta:'Creative portfolio · 2026'},{eyebrow:'Campaign 01',title:'Thoda Aur',desc:'A brand platform built around a simple Indian instinct: wanting just a little more.',meta:'Brand campaign · Mudrex · 2026',link:'#'},{eyebrow:'Film 01',title:'The work should move before the viewer does.',desc:'A film-led project. Replace this with a one-line thought behind the work.',meta:'Film · Direction / Copy · 2026',link:'#'},{type:'outro',eyebrow:'End of sheet',title:'Still writing.',desc:'For work, collaborations, or a good conversation.',meta:'your@email.com'}];
let data=load();function load(){try{return JSON.parse(localStorage.getItem('twPortfolio'))||structuredClone(defaults)}catch(e){return structuredClone(defaults)}}function save(){localStorage.setItem('twPortfolio',JSON.stringify(data));render()}
function addProject(){data.splice(Math.max(1,data.length-1),0,{eyebrow:'New project',title:'Untitled',desc:'Write the idea behind this work.',meta:'Category · Year',link:'',images:[]});save()}
function field(i,k,v){data[i][k]=v;localStorage.setItem('twPortfolio',JSON.stringify(data))}function del(i){data.splice(i,1);save()}function move(i,d){const j=i+d;if(j<0||j>=data.length)return;[data[i],data[j]]=[data[j],data[i]];save()}
function upload(i,files){const arr=[];[...files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=e=>{arr.push(e.target.result);if(arr.length===Math.min(files.length,6)){data[i].images=[...(data[i].images||[]),...arr].slice(0,6);save()}};r.readAsDataURL(f)})}
function render(){const el=document.getElementById('list');el.innerHTML='';data.forEach((p,i)=>{const d=document.createElement('section');d.className='card';d.innerHTML=`<div class="row"><div><label>Eyebrow</label><input value="${q(p.eyebrow||'')}" oninput="field(${i},'eyebrow',this.value)"></div><div><label>Meta</label><input value="${q(p.meta||'')}" oninput="field(${i},'meta',this.value)"></div></div><label>Project title</label><input value="${q(p.title||'')}" oninput="field(${i},'title',this.value)"><label>Description</label><textarea oninput="field(${i},'desc',this.value)">${h(p.desc||'')}</textarea><label>Film / case-study link</label><input value="${q(p.link||'')}" placeholder="Google Drive / YouTube / case study URL" oninput="field(${i},'link',this.value)"><label>Creative images</label><input type="file" accept="image/*" multiple onchange="upload(${i},this.files)"><div class="thumbs">${(p.images||[]).map(x=>`<img src="${x}">`).join('')}</div><div class="actions"><button class="secondary" onclick="move(${i},-1)">↑</button><button class="secondary" onclick="move(${i},1)">↓</button><button class="danger" onclick="del(${i})">Delete</button></div>`;el.appendChild(d)})}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='portfolio-data.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{data=JSON.parse(x.target.result);save()}catch{alert('Invalid JSON')}};r.readAsText(f)});function resetAll(){if(confirm('Reset to demo projects?')){data=structuredClone(defaults);save()}}function q(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}render();
</script></body></html>
